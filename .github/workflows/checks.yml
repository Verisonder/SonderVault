name: Checks

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
  workflow_dispatch:

# There is no Gradle wrapper in this repository. CI installs Gradle instead, so no
# binary jar sits in source control.
jobs:
  checks:
    name: Unit tests and debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee -a build-output.txt

      - name: Debug build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee -a build-output.txt

      # A green test build does not imply a green debug build and the reverse is just as
      # true, so both run. Theme attributes in drawables have broken one variant while
      # leaving the other passing before.

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build-output.txt
            app/build/reports/tests/
          retention-days: 7

      - name: Summarise a failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failed'
            echo
            echo 'Compiler and test output, last 150 lines:'
            echo '```'
            grep -E '^(e:|w: .*error|FAILURE|\* What went wrong|Caused by|[0-9]+ tests? completed)' build-output.txt | head -n 60 || true
            echo '...'
            tail -n 150 build-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
