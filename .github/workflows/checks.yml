name: Checks

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
  workflow_dispatch:

# There is no Gradle wrapper in this repository. CI installs Gradle instead, so no
# binary jar sits in source control.
jobs:
  checks:
    name: Unit tests and debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee -a build-output.txt

      - name: Debug build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee -a build-output.txt

      # A green test build does not imply a green debug build and the reverse is just as
      # true, so both run. Theme attributes in drawables have broken one variant while
      # leaving the other passing before.

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build-output.txt
            app/build/reports/tests/
          retention-days: 7

      # CI logs are served from blob storage, which is unreachable from the environment
      # this project is worked on in. So a failure writes itself somewhere readable
      # instead. Deliberately not a GitHub issue: an auto-opened issue shows up on the
      # owner's public profile timeline, and a failed build on a branch is a normal step
      # in developing it, not something to announce.
      - name: Record the failure
        if: failure()
        shell: bash
        env:
          ARTIFACTS_PAT: ${{ secrets.ARTIFACTS_PAT }}
        run: |
          if [ -z "$ARTIFACTS_PAT" ]; then
            echo "ARTIFACTS_PAT is not set; skipping. A missing secret must not fail the build."
            exit 0
          fi
          {
            echo "repository : $GITHUB_REPOSITORY"
            echo "branch     : $GITHUB_REF_NAME"
            echo "commit     : $GITHUB_SHA"
            echo "run        : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "recorded   : $(date -u +%FT%TZ)"
            echo
            echo "--- errors ---"
            grep -E '^(e:|FAILURE|\* What went wrong|Caused by|[0-9]+ tests? completed)' build-output.txt | head -n 80 || true
            echo
            echo "--- tail ---"
            tail -n 200 build-output.txt || true
          } > failure.txt
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.request

          url = "https://api.github.com/repos/Verisonder/vs-artifacts/contents/failures/latest.txt"
          headers = {"Authorization": "Bearer " + os.environ["ARTIFACTS_PAT"],
                     "Accept": "application/vnd.github+json"}

          def call(method, body=None):
              req = urllib.request.Request(url, method=method, headers=headers,
                                           data=json.dumps(body).encode() if body else None)
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          status, existing = call("GET")
          body = {
              "message": "Record a build failure",
              "content": base64.b64encode(open("failure.txt", "rb").read()).decode(),
              "committer": {"name": "Verisonder",
                            "email": "verisonder@users.noreply.github.com"},
          }
          if status == 200:
              body["sha"] = existing["sha"]
          status, result = call("PUT", body)
          print("recorded to vs-artifacts:", status)
          if status not in (200, 201):
              print(result)
          PY
