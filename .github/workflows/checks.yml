name: Checks

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
  workflow_dispatch:

# There is no Gradle wrapper in this repository. CI installs Gradle instead, so no
# binary jar sits in source control.
jobs:
  checks:
    name: Unit tests and debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Debug build
        run: gradle --no-daemon assembleDebug

      # A green test build does not imply a green debug build and the reverse is just as
      # true, so both run. Theme attributes in drawables have broken one variant while
      # leaving the other passing before.

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 7

      - name: Summarise a failure
        if: failure()
        run: |
          {
            echo '## Build failed'
            echo
            echo 'Compiler errors, most recent run:'
            echo '```'
            find app/build/reports -name '*.txt' -exec tail -n 40 {} + 2>/dev/null | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
